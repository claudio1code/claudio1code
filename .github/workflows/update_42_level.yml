name: Update 42 Level Badge

on:
  schedule:
    # Roda todos os dias às 00:00 UTC
    - cron: '0 0 1,10 * *'
  workflow_dispatch: # Permite que você rode o script manualmente com um botão na aba "Actions"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        env:
          INTRA_CLIENT_ID: ${{ secrets.INTRA_CLIENT_ID }}
          INTRA_CLIENT_SECRET: ${{ secrets.INTRA_CLIENT_SECRET }}
        run: python update_level.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          # Só faz o commit se houver alguma alteração (se o level subiu)
          git commit -m "docs: auto-update 42 level badge" || exit 0
          git push
