name: Update 42 Portfolio

on:
    schedule:
        - cron: "0 0 * * *" # Runs every day at midnight UTC
    workflow_dispatch: # Allows running manually from the Actions tab

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.x"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

            - name: Update README
              env:
                  UID_42: ${{ secrets.UID_42 }}
                  SECRET_42: ${{ secrets.SECRET_42 }}
                  USER_42: ${{ secrets.USER_42 }}
              run: python update_readme.py

            - name: Commit and push changes
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git add README.md
                  # Only commit if there are changes
                  git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update portfolio stats [skip ci]" && git push)
